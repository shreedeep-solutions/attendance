<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SS Attendance">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Attendance &amp; Payroll — Shreedeep Solutions</title>
<style>
/* ===== macOS / iOS design system ===== */
:root{--tint:#8b1e2f;--tint2:#a8273b;--tintbg:rgba(139,30,47,.10);
--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--ink2:#3a3a3c;--mut:rgba(60,60,67,.62);--line:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.07);
--bar:rgba(250,250,252,.8);--side:rgba(236,236,241,.82);--sel:rgba(139,30,47,.12);
--green:#34c759;--orange:#ff9500;--red:#ff3b30;--blue:#007aff;--teal:#30b0c7;--indigo:#5856d6;--gray:#8e8e93;--brown:#a2845e;--purple:#af52de;
--shadow:0 1px 1px rgba(0,0,0,.03),0 2px 10px rgba(0,0,0,.04);--r:14px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[data-theme=dark]{--tint:#e2556b;--tint2:#ff6f84;--tintbg:rgba(226,85,107,.16);--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--ink2:#d1d1d6;--mut:rgba(235,235,245,.6);--line:rgba(84,84,88,.5);
--fill:rgba(118,118,128,.26);--fill2:rgba(118,118,128,.16);--bar:rgba(22,22,24,.78);--side:rgba(28,28,30,.85);--sel:rgba(226,85,107,.22);--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.38;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:15px;padding:9px 11px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);max-width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--tintbg)}
input[type=checkbox]{width:44px;height:26px;padding:0;border-radius:13px;background:var(--fill);position:relative;flex:none;transition:background .2s;cursor:pointer}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
input[type=checkbox]:checked{background:var(--green)}
input[type=checkbox]:checked::after{left:20px}
input[type=file]{background:none;padding:4px 0;font-size:13px}
a{color:var(--tint2);text-decoration:none}
.hidden{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- app shell ---- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.side .logo{width:34px;height:34px;border-radius:9px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side .brand b{display:block;font-size:14px}.side .brand span{font-size:11.5px;color:var(--mut)}
.side .nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);text-align:left;width:100%}
.side .nav:hover{background:var(--fill2)}
.side .nav.on{background:var(--sel);color:var(--tint2)}
.side .nav .bdg{margin-left:auto}
.side .foot{margin-top:auto;padding:10px 8px 0;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.side .foot b{color:var(--ink);font-size:13px}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar .t{font-weight:600;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--mut);font-weight:400}
.ib{border:0;background:var(--fill);color:var(--ink);border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg.i{width:18px;height:18px}
main{padding:18px 22px 40px;max-width:1240px;margin:0 auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:7px 2px 5px;font-size:10.5px;font-weight:500;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabbar button svg.i{width:24px;height:24px}
.tabbar button.on{color:var(--tint2)}
.tabbar .bdg{position:absolute;top:2px;left:calc(50% + 6px)}
.phone main{padding:12px 14px 96px;max-width:680px}

/* ---- typography & layout ---- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2,.lt{margin:0 auto 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sec-h{font-size:13px;font-weight:400;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;margin:18px 4px 6px}
.muted{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:17px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.list .li{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;min-height:46px}
.list .li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.list .li .grow{flex:1;min-width:0}
.list .li .chev{color:var(--gray)}
.list button.li{width:100%;border:0;background:none;text-align:left;font-size:15px}
.list button.li:active{background:var(--fill2)}

/* ---- buttons, chips, segmented ---- */
.btn{border:0;background:var(--tint);color:#fff;padding:8px 15px;border-radius:10px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.o{background:var(--tintbg);color:var(--tint2)}
.btn.g{background:var(--fill);color:var(--ink)}
.btn.r{background:var(--red);color:#fff}
.btn.gr{background:var(--green);color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.s{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.big{padding:15px 20px;font-size:17px;width:100%;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--tint);color:#fff}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bdg{display:inline-block;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:600;min-width:18px;text-align:center}

/* ---- status capsules ---- */
.code{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:7px;color:#fff;font-weight:600;font-size:11px;line-height:1.45}
.c-P{background:var(--green)}.c-H{background:var(--orange)}.c-A{background:var(--red)}.c-NR{background:var(--purple)}.c-UL{background:var(--brown)}.c-SL{background:var(--teal)}
.c-WO{background:var(--gray)}.c-HO{background:var(--indigo)}.c-PEND{background:var(--fill);color:var(--mut)}.c-FUT,.c-NJ,.c-NT{background:transparent;color:var(--mut)}
.flag{display:inline-block;background:rgba(255,149,0,.15);color:#b25e00;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;margin:1px}
.ok{display:inline-block;background:rgba(52,199,89,.15);color:#1a7f37;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
.bad{display:inline-block;background:rgba(255,59,48,.13);color:#c4251b;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
[data-theme=dark] .flag{color:#ffb340}[data-theme=dark] .ok{color:#4cd964}[data-theme=dark] .bad{color:#ff6961}
.warn{background:rgba(255,149,0,.12);color:var(--ink);padding:10px 13px;border-radius:12px;font-size:13.5px;margin-bottom:12px}
.err{background:rgba(255,59,48,.12);color:var(--ink);padding:10px 13px;border-radius:12px;font-size:14px;margin-bottom:12px}
.info{background:var(--tintbg);padding:10px 13px;border-radius:12px;font-size:13.5px;margin-bottom:12px}

/* ---- tables ---- */
.tw{overflow:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;vertical-align:middle;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card);z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
.reg td,.reg th{padding:5px 2px;text-align:center;font-size:11px}
.reg td.nm,.reg th.nm{position:sticky;left:0;background:var(--card);text-align:left;z-index:2;padding-left:12px;min-width:120px}
.reg th.nm{z-index:3}
.reg td.cell{cursor:pointer}
.reg td.cell:hover{background:var(--fill2)}
.reg td.cell.fl .code{box-shadow:0 0 0 2px var(--orange)}
.reg th.off,.reg th.hol{color:var(--gray)}.reg th.today{color:var(--tint2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:6px 2px 10px;font-size:12px;color:var(--mut);align-items:center}

/* ---- forms ---- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut);font-weight:500}
.form label.full{grid-column:1/-1}
.form label.ck{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);font-size:14.5px;background:var(--fill2);padding:8px 12px;border-radius:10px}
.form .sec{grid-column:1/-1;font-size:13px;font-weight:400;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;margin-top:10px}

/* ---- sheets (modal) ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;overflow:auto;animation:fade .2s}
.modal .box{background:var(--card);border-radius:16px;padding:18px 20px 20px;max-width:620px;width:100%;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal .box.wide{max-width:1000px}
.modal h3{margin:0 0 12px;font-size:19px;font-weight:700}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.94);opacity:0}}@keyframes up{from{transform:translateY(100%)}}
@media (max-width:700px){
 .modal{align-items:flex-end;padding:0}
 .modal .box,.modal .box.wide{border-radius:16px 16px 0 0;max-height:92vh;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
 .modal .box::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 12px}
}
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);background:rgba(30,30,32,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:22px;opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1.2);z-index:80;pointer-events:none;max-width:92%;text-align:center;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- misc ---- */
.center{max-width:440px;margin:7vh auto;padding:0 14px}
.center h1{margin:0 0 4px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.applogo{width:72px;height:72px;border-radius:17px;margin:0 auto 12px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{background:var(--fill2);border-radius:10px;min-height:56px;padding:5px;font-size:11px;overflow:hidden}
.cal .hd{background:none;min-height:0;text-align:center;font-weight:600;color:var(--mut)}
.cal .dn{font-weight:600;color:var(--mut);margin-bottom:2px}
.cal .tdy{box-shadow:inset 0 0 0 2px var(--tint)}
.locked{background:var(--fill);color:var(--ink);padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600}
input.amt{width:90px;text-align:right}
.offline{background:var(--ink);color:var(--card);text-align:center;font-size:12.5px;padding:5px}
.hero{text-align:center;padding:22px 12px}
.hero .t{font-size:30px;font-weight:700;margin:2px 0;letter-spacing:-.02em}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:9px 0;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden}
.cam video{width:100%;display:block;max-height:60vh;object-fit:cover}
.cam .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;color:#fff;font-weight:700;text-shadow:0 2px 8px #000}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px}
.selfie{width:56px;height:56px;object-fit:cover;border-radius:10px;cursor:pointer}
/* compact photo strip for daily report */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--fill);border:0;padding:0}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .more{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--ink)}
.filerow{display:flex;align-items:center;gap:12px;background:var(--fill2);border-radius:12px;padding:10px 12px}
.filerow .ic{width:38px;height:46px;border-radius:6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;flex:none}
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.step.done .n{background:var(--green);color:#fff}
/* kiosk */
.kiosk{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:var(--bg)}
.kiosk .clock{font-size:60px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kiosk .qr{background:#fff;padding:20px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.kiosk .qr svg{width:min(60vh,80vw);height:min(60vh,80vw);display:block}
.kiosk .prog{height:5px;background:var(--fill);border-radius:3px;width:min(60vh,80vw);overflow:hidden}
.kiosk .prog div{height:100%;background:var(--tint);transition:width 1s linear}
.kiosk .feed{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.kiosk .feed span{background:var(--card);border-radius:20px;padding:6px 13px;font-size:13px;box-shadow:var(--shadow)}
.kiosk .flash{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 28px;border-radius:18px;font-size:22px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#print-area{display:none}
.spin{width:30px;height:30px;border:3px solid var(--fill);border-top-color:var(--tint);border-radius:50%;animation:rot .8s linear infinite;margin:6px auto 10px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:900px){.shell{display:block}.side{display:none}}
@media (min-width:901px){.tabbar.adm{display:none}.topbar.adm{display:none}}
@media (max-width:700px){.form,.grid2{grid-template-columns:1fr}main{padding:12px 14px 96px}.grid{grid-template-columns:1fr}.bar h2,.lt{font-size:26px}}
@media print{
  body{background:#fff;color:#000}
  #app,#modal,#toast,.tabbar{display:none!important}
  #print-area{display:block}
  .doc{page-break-after:always;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12px;padding:8mm 10mm}
  .doc:last-child{page-break-after:auto}
  .doc .lh{text-align:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .doc .lh h1{margin:0;font-size:22px;letter-spacing:.5px}
  .doc .lh div{font-size:11px}
  .doc h2{text-align:center;font-size:14px;margin:8px 0 10px;text-decoration:underline}
  .doc table{width:100%;border-collapse:collapse;margin-bottom:10px}
  .doc td,.doc th{border:1px solid #000;padding:5px 7px;white-space:normal;color:#000;background:#fff;position:static;font-size:11.5px;text-transform:none;letter-spacing:0}
  .doc .net{font-size:14px;font-weight:700}
  .doc .sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px}
  .doc .sigr{text-align:center;min-width:300px}
  .doc .sigr .two{display:flex;gap:30px;justify-content:center;margin-top:6px}
  .doc .sigr .one{text-align:center}
  .doc .sigimg{height:46px;display:block;margin:0 auto}
  .doc .stamp{height:70px;position:absolute;margin-left:-40px;margin-top:-30px;opacity:.85}
  .doc .blank{height:46px}
  .doc p{line-height:1.6;text-align:justify}
  .doc.small td,.doc.small th{font-size:9px;padding:2px 3px;text-align:center}
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<body>
<div id="app"><div class="center card">Loading…</div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="print-area"></div>
<script>
